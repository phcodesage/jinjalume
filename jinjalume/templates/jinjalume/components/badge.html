{% macro badge(label, variant="neutral", class_name="") -%}
  {% set variants = {
    "neutral": "bg-slate-100 text-slate-700",
    "success": "bg-emerald-100 text-emerald-700",
    "warning": "bg-amber-100 text-amber-800",
    "danger": "bg-red-100 text-red-700"
  } %}
  <span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold {{ variants.get(variant, variants["neutral"]) }} {{ class_name }}">{{ label }}</span>
{%- endmacro %}
