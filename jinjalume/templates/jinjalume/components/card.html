{% macro card(title=None, description=None, class_name="") -%}
  <section class="rounded-2xl bg-[var(--jl-surface)] p-6 shadow-sm ring-1 ring-[var(--jl-border)] {{ class_name }}">
    {% if title %}<h2 class="text-lg font-semibold text-[var(--jl-text)]">{{ title }}</h2>{% endif %}
    {% if description %}<p class="{% if title %}mt-1 {% endif %}text-sm text-[var(--jl-text-muted)]">{{ description }}</p>{% endif %}
    <div class="{% if title or description %}mt-5 {% endif %}text-[var(--jl-text-muted)]">
      {{ caller() }}
    </div>
  </section>
{%- endmacro %}
