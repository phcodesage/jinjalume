{% macro spinner(label="Loading", size="md", class_name="") -%}
  {% set sizes = {
    "sm": "h-4 w-4",
    "md": "h-6 w-6",
    "lg": "h-8 w-8"
  } %}
  <span class="inline-flex items-center gap-2 {{ class_name }}" role="status" aria-label="{{ label }}">
    <svg class="animate-spin {{ sizes.get(size, sizes["md"]) }} text-violet-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span class="sr-only">{{ label }}</span>
  </span>
{%- endmacro %}
