[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jinjalume"
version = "0.1.0"
description = "Server-rendered Tailwind UI components for Flask and Jinja applications"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jinjalume contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/phcodesage/jinjalume"
Issues = "https://github.com/phcodesage/jinjalume/issues"
Source = "https://github.com/phcodesage/jinjalume"

[tool.setuptools.packages.find]
include = ["jinjalume*"]

[tool.setuptools.package-data]
jinjalume = ["templates/jinjalume/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
